name: NuncioCrew Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Crew version: vX.Y.Z-dev[.N] or vX.Y.Z"
        required: true
        type: string
      channel:
        description: "Updater channel"
        required: true
        type: choice
        options:
          - dev
          - stable
      ref:
        description: "Exact 40-character commit SHA from main"
        required: true
        type: string
      publish:
        description: "Publish GitHub release after the signed build passes"
        required: true
        default: false
        type: boolean

concurrency:
  group: nuncio-crew-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'Nuncio-hq/crew' &&
      github.ref == 'refs/heads/main'
    environment: nuncio-crew-release
    runs-on: macos-15
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      TARGET: aarch64-apple-darwin
      SOURCE_REF: ${{ inputs.ref }}
      RELEASE_VERSION_TAG: ${{ inputs.version }}
      RELEASE_CHANNEL: ${{ inputs.channel }}
      VITE_NUNCIO_CREW_CHANNEL: ${{ inputs.channel }}
      VITE_NUNCIO_CREW_RELEASES_URL: https://github.com/Nuncio-hq/crew/releases
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable source on main
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::ref must be a full commit SHA"
            exit 1
          }
          RESOLVED=$(git rev-parse --verify "${SOURCE_REF}^{commit}")
          HEAD_SHA=$(git rev-parse 'HEAD^{commit}')
          [[ "$RESOLVED" == "$HEAD_SHA" ]] || {
            echo "::error::checkout does not match requested commit"
            exit 1
          }
          git fetch --no-tags origin main:refs/remotes/origin/main
          MAIN_SHA=$(git rev-parse 'refs/remotes/origin/main^{commit}')
          [[ "$HEAD_SHA" == "$MAIN_SHA" ]] || {
            echo "::error::release commit is not the current origin/main HEAD"
            exit 1
          }

      - name: Validate version and channel
        id: release
        run: |
          node desktop/scripts/nuncio-crew-release-channel.mjs \
            "$RELEASE_VERSION_TAG" "$RELEASE_CHANNEL" "$SOURCE_REF" \
            >> "$GITHUB_OUTPUT"

      - name: Verify Crew release tag is available
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin \
            "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::release tag already exists: $RELEASE_TAG"
            exit 1
          fi

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Check signing inputs
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.NUNCIO_APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.NUNCIO_APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.NUNCIO_APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.NUNCIO_APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.NUNCIO_APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.NUNCIO_APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.NUNCIO_APPLE_API_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.NUNCIO_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.NUNCIO_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_PUBLIC_KEY: ${{ vars.NUNCIO_TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          for name in \
            APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY APPLE_TEAM_ID APPLE_API_ISSUER \
            APPLE_API_KEY APPLE_API_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD UPDATER_PUBLIC_KEY; do
            [[ -n "${!name:-}" ]] || {
              echo "::error::Missing release credential: $name"
              exit 1
            }
          done

      - name: Install dependencies and patch artifact version
        run: |
          just desktop-install-ci
          cd desktop
          node scripts/set-version-from-tag.mjs \
            "${{ steps.release.outputs.version }}"
          node scripts/sync-nuncio-crew-cargo-lock-version.mjs \
            buzz-desktop "${{ steps.release.outputs.version }}"

      - name: Configure updater
        env:
          BUZZ_UPDATER_PUBLIC_KEY: ${{ vars.NUNCIO_TAURI_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: ${{ steps.release.outputs.updater_endpoint }}
        run: cd desktop && node scripts/build-release-config.mjs

      - name: Import Developer ID and notarization key
        id: apple
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.NUNCIO_APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.NUNCIO_APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.NUNCIO_APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.NUNCIO_APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/nuncio-crew.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          CERTIFICATE_PATH="$RUNNER_TEMP/nuncio-crew.p12"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode \
            > "$CERTIFICATE_PATH"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$API_KEY_PATH"
          chmod 600 "$CERTIFICATE_PATH" "$API_KEY_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          echo "keychain_path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"
          echo "api_key_path=$API_KEY_PATH" >> "$GITHUB_OUTPUT"

      - name: Build sidecars
        run: |
          cargo build --release --target "$TARGET" \
            -p buzz-acp -p buzz-agent -p buzz-backend-kubernetes \
            -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh "$TARGET"

      - name: Build, sign, and notarize
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.NUNCIO_APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.NUNCIO_APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.NUNCIO_APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.NUNCIO_APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ steps.apple.outputs.api_key_path }}
          BUZZ_UPDATER_PUBLIC_KEY: ${{ vars.NUNCIO_TAURI_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: ${{ steps.release.outputs.updater_endpoint }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.NUNCIO_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.NUNCIO_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd desktop
          pnpm exec tauri build --verbose --target "$TARGET" \
            --bundles app,dmg \
            --config src-tauri/tauri.nuncio-crew-release.conf.json \
            --config src-tauri/tauri.release.conf.json

      - name: Notarize and staple DMG
        env:
          APPLE_API_ISSUER: ${{ secrets.NUNCIO_APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.NUNCIO_APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ steps.apple.outputs.api_key_path }}
        run: |
          set -euo pipefail
          BUNDLE="desktop/src-tauri/target/$TARGET/release/bundle"
          DMG=$(find "$BUNDLE/dmg" -name '*.dmg' -type f | head -1)
          [[ -f "$DMG" ]] || {
            echo "::error::signed DMG is missing"
            exit 1
          }
          xcrun notarytool submit "$DMG" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG"

      - name: Verify and locate artifacts
        id: artifacts
        run: |
          set -euo pipefail
          BUNDLE="desktop/src-tauri/target/$TARGET/release/bundle"
          APP=$(find "$BUNDLE/macos" -maxdepth 1 -name '*.app' -type d | head -1)
          DMG=$(find "$BUNDLE/dmg" -name '*.dmg' -type f | head -1)
          ARCHIVE=$(find "$BUNDLE/macos" -name '*.app.tar.gz' -type f | head -1)
          [[ -d "$APP" && -f "$DMG" && -f "$ARCHIVE" \
            && -f "${ARCHIVE}.sig" ]] || {
            echo "::error::signed release artifacts are incomplete"
            exit 1
          }
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          xcrun stapler validate "$DMG"
          desktop/scripts/verify-macos-entitlements.sh "$APP"
          UPDATER_PUBLIC_KEY="${{ vars.NUNCIO_TAURI_UPDATER_PUBLIC_KEY }}" \
            node desktop/scripts/verify-nuncio-crew-updater-key-id.mjs \
              "${ARCHIVE}.sig"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "signature=${ARCHIVE}.sig" >> "$GITHUB_OUTPUT"
          echo "archive_name=$(basename "$ARCHIVE")" >> "$GITHUB_OUTPUT"

      - name: Preserve signed dry-run artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: NuncioCrew-${{ inputs.version }}-macOS-arm64
          path: |
            ${{ steps.artifacts.outputs.dmg }}
            ${{ steps.artifacts.outputs.archive }}
            ${{ steps.artifacts.outputs.signature }}
          if-no-files-found: error

      - name: Publish versioned and rolling releases
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          ROLLING_TAGS: ${{ steps.release.outputs.rolling_tags }}
          DMG_PATH: ${{ steps.artifacts.outputs.dmg }}
          ARCHIVE_PATH: ${{ steps.artifacts.outputs.archive }}
          SIGNATURE_PATH: ${{ steps.artifacts.outputs.signature }}
          ARCHIVE_NAME: ${{ steps.artifacts.outputs.archive_name }}
        run: |
          set -euo pipefail
          IFS=',' read -r -a TAGS <<< "$ROLLING_TAGS"
          for rolling in "${TAGS[@]}"; do
            if gh release view "$rolling" >/dev/null 2>&1; then
              CURRENT_MANIFEST="$RUNNER_TEMP/$rolling-latest.json"
              gh release download "$rolling" --pattern latest.json \
                --output "$CURRENT_MANIFEST" --clobber
              node desktop/scripts/assert-nuncio-crew-channel-advance.mjs \
                "$VERSION" "$CURRENT_MANIFEST"
            fi
          done
          RELEASE_FLAGS=(--draft --latest=false)
          [[ "$PRERELEASE" == "true" ]] && RELEASE_FLAGS+=(--prerelease)
          gh release create "$RELEASE_TAG" --target "$SOURCE_REF" \
            --title "NuncioCrew v$VERSION" \
            --notes "NuncioCrew v$VERSION ($RELEASE_CHANNEL channel)." \
            "${RELEASE_FLAGS[@]}"
          gh release upload "$RELEASE_TAG" \
            "$DMG_PATH" "$ARCHIVE_PATH" "$SIGNATURE_PATH"
          ARCHIVE_URL="https://github.com/Nuncio-hq/crew/releases/download/$RELEASE_TAG/$ARCHIVE_NAME"
          node desktop/scripts/generate-nuncio-crew-latest-json.mjs \
            "v$VERSION" "$SIGNATURE_PATH" "$ARCHIVE_URL" > latest.json
          if [[ "$PRERELEASE" == "true" ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest=true
          fi
          for rolling in "${TAGS[@]}"; do
            gh release view "$rolling" >/dev/null 2>&1 || \
              gh release create "$rolling" --target "$SOURCE_REF" \
                --prerelease --latest=false \
                --title "NuncioCrew updater: $rolling" \
                --notes "Rolling Tauri updater manifest. Install from a versioned release."
            gh release upload "$rolling" latest.json --clobber
          done

      - name: Remove temporary signing keychain
        if: always()
        env:
          APPLE_API_KEY: ${{ secrets.NUNCIO_APPLE_API_KEY_ID }}
        run: |
          security delete-keychain \
            "$RUNNER_TEMP/nuncio-crew.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/nuncio-crew.p12"
          rm -f "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
