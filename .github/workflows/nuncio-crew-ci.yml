name: NuncioCrew CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: nuncio-crew-ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

jobs:
  changes:
    name: CI Policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      desktop-rust: ${{ steps.filter.outputs.desktop-rust }}
      relay: ${{ steps.filter.outputs.relay }}
      acp: ${{ steps.filter.outputs.acp }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            desktop:
              - 'desktop/**'
              - 'crates/**'
              - 'scripts/build-nuncio-crew-local.sh'
              - 'scripts/bundle-sidecars.sh'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'rust-toolchain.toml'
              - 'Justfile'
              - '.github/workflows/nuncio-crew-ci.yml'
            desktop-rust:
              - 'desktop/src-tauri/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'Justfile'
              - '.github/workflows/nuncio-crew-ci.yml'
            relay:
              - 'desktop/src/features/projects/**'
              - 'desktop/src/shared/nostr/**'
              - 'crates/**'
              - 'migrations/**'
              - 'schema/**'
              - 'docker-compose.yml'
              - 'scripts/attach-schema-partitions.sql'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Justfile'
              - '.github/workflows/nuncio-crew-ci.yml'
              - 'scripts/run-nuncio-crew-project-relay-ci.sh'
            acp:
              - 'crates/buzz-acp/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'Justfile'
              - '.github/workflows/nuncio-crew-ci.yml'
      - name: Verify Crew workflow contracts
        run: node --test desktop/src/testing/nuncio-crew-*.test.mjs

  desktop-fast:
    name: Desktop Fast
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 2
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - name: Install desktop dependencies
        run: just desktop-install-ci
      - name: Check desktop
        run: just desktop-check
      - name: Test desktop
        run: just desktop-test
      - name: Build desktop
        run: just desktop-build

  # Path-gated Tauri Rust clippy + unit tests. Relevance key in the gate payload
  # is `desktop-rust-changed` (not `desktop-rust`) so it cannot collide with the
  # job result key — check-nuncio-crew-ci-results.mjs reads both from one object.
  desktop-rust:
    name: Desktop Rust
    needs: changes
    if: needs.changes.outputs.desktop-rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: desktop/src-tauri
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Install Tauri dependencies (Linux)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30
          sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=120 \
            build-essential \
            curl \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget
      - name: Desktop Tauri clippy
        run: just desktop-tauri-clippy
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      - name: Desktop Tauri tests
        run: just desktop-tauri-test
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"

  macos-arm:
    name: macOS ARM Package
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      TARGET: aarch64-apple-darwin
      VITE_NUNCIO_CREW_CHANNEL: dev
      VITE_NUNCIO_CREW_RELEASES_URL: https://github.com/Nuncio-hq/crew/releases
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: desktop/src-tauri
          key: nuncio-macos-arm
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Install dependencies
        run: |
          rustup target add "$TARGET"
          just desktop-install-ci
      - name: Create package-only sidecars
        run: |
          mkdir -p desktop/src-tauri/binaries
          for binary in buzz-acp buzz-agent buzz-backend-kubernetes buzz-dev-mcp git-credential-nostr buzz; do
            touch "desktop/src-tauri/binaries/${binary}-${TARGET}"
          done
      - name: Build unsigned NuncioCrew package
        run: |
          cd desktop
          pnpm exec tauri build --target "$TARGET" --bundles app \
            --config src-tauri/tauri.nuncio-crew-release.conf.json --no-sign
      - name: Verify package identity and architecture
        run: |
          APP=desktop/src-tauri/target/$TARGET/release/bundle/macos/NuncioCrew.app
          test -d "$APP"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' \
            "$APP/Contents/Info.plist")
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
            "$APP/Contents/Info.plist")" = "com.nuncio.crew"
          file "$APP/Contents/MacOS/$EXECUTABLE" | grep -q arm64

  project-relay:
    name: Project Relay
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Install desktop dependencies
        run: just desktop-install-ci
      - name: Run the relay-native Project contract
        env:
          CREW_LIVE_RELAY_URL: ws://localhost:3000
        run: |
          bash scripts/run-nuncio-crew-project-relay-ci.sh \
            desktop/src/features/projects/project-local-workspace-live-relay.test.mjs
      - name: Upload relay log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuncio-crew-project-relay-log
          path: /tmp/nuncio-crew-relay.log
          if-no-files-found: ignore

  # Desktop Rust only exercises desktop/src-tauri. buzz-acp is a separate crate
  # with no Tauri dependency edge, so a green Desktop Rust run can hide a red
  # harness (issue #49). Gate this lane whenever the ACP crate or workspace pins
  # move. Relevance key is `acp` (filter output); job result key is `buzz-acp`.
  buzz-acp:
    name: buzz-acp
    needs: changes
    if: needs.changes.outputs.acp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: nuncio-buzz-acp
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Test buzz-acp
        run: just buzz-acp-test

  # Advisory only until the smoke suite's ~5 moving failures per green run are
  # attributed and quarantined (#37). continue-on-error keeps the signal visible
  # without red-walling every desktop PR. Do not add this job to `gate.needs` or
  # JOB_RELEVANCE until it can fail for real reasons — see issue #36 / plan step 5.
  desktop-smoke-e2e:
    name: Desktop Smoke E2E (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install desktop dependencies
        run: just desktop-install-ci
      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(cd desktop && node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd desktop && pnpm exec playwright install chromium
      - name: Install Playwright system dependencies
        run: cd desktop && pnpm exec playwright install-deps chromium
      - name: Save Playwright browser cache
        if: steps.playwright-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && matrix.shard == 1
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - name: Desktop E2E build
        run: pnpm -C desktop build:e2e
      - name: Desktop smoke e2e
        run: cd desktop && pnpm exec playwright test --project=smoke --shard=${{ matrix.shard }}/4
      - name: Summarize flaky tests
        if: ${{ !cancelled() }}
        run: node scripts/summarize-flaky-tests.mjs playwright-report.json "Desktop Smoke E2E (${{ matrix.shard }})"
        working-directory: desktop
      - name: Upload desktop smoke e2e artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-smoke-e2e-artifacts-${{ matrix.shard }}
          path: |
            desktop/playwright-report
            desktop/playwright-report.json
            desktop/test-results
          if-no-files-found: ignore
          retention-days: 7

  gate:
    name: NuncioCrew Gate
    if: ${{ always() }}
    needs: [changes, desktop-fast, desktop-rust, macos-arm, project-relay, buzz-acp]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - name: Require all relevant Crew checks
        run: |
          node desktop/scripts/check-nuncio-crew-ci-results.mjs \
            '{"ci-policy":"${{ needs.changes.result }}","desktop":"${{ needs.changes.outputs.desktop }}","desktop-rust-changed":"${{ needs.changes.outputs.desktop-rust }}","relay":"${{ needs.changes.outputs.relay }}","acp":"${{ needs.changes.outputs.acp }}","desktop-fast":"${{ needs.desktop-fast.result }}","desktop-rust":"${{ needs.desktop-rust.result }}","macos-arm":"${{ needs.macos-arm.result }}","project-relay":"${{ needs.project-relay.result }}","buzz-acp":"${{ needs.buzz-acp.result }}"}'
